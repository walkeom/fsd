
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>Student Marks Calculator</h2>

    <form id="marksForm">
        <label>Student Name</label>
        <input type="text" id="name" required>

        <label>Subject 1 Marks</label>
        <input type="number" id="m1" min="0" max="100" required>

        <label>Subject 2 Marks</label>
        <input type="number" id="m2" min="0" max="100" required>

        <label>Subject 3 Marks</label>
        <input type="number" id="m3" min="0" max="100" required>

        <button type="submit">Calculate</button>
    </form>

    <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
