
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Result Management System</h1>

    <div class="container">
        <h2>Enter Student Details</h2>

        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="roll" placeholder="Roll Number">

        <input type="number" id="m1" placeholder="Subject 1 Marks" min="0" max="100">
        <input type="number" id="m2" placeholder="Subject 2 Marks" min="0" max="100">
        <input type="number" id="m3" placeholder="Subject 3 Marks" min="0" max="100">

        <button onclick="addResult()">Add Result</button>
    </div>

    <h2>Student Results</h2>

    <table id="resultTable">
        
            <tr>
                <th>Name</th>
                <th>Roll No.</th>
                <th>Total</th>
                <th>Percentage</th>
                <th>Result</th>
            </tr>
       
    </table>

    <h2 id="topper">Topper: Not declared yet</h2>

    <script src="script.js"></script>
</body>
</html>
