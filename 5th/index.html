
<!DOCTYPE html>
<html>
<head>
    <title>Library Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>College Library</h1>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#books">Available Books</a>
    <a href="#issue">Issue Book</a>
</nav>

<section id="home">
    <h2>Welcome to Our Library</h2>
    <p>Find and issue your favorite books here.</p>
</section>

<section id="books">
    <h2>Available Books</h2>

    <table>
        <tr>
            <th>Book ID</th>
            <th>Book Name</th>
            <th>Author</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Web Development</td>
            <td>John</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Programming in C</td>
            <td>James</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Java Basics</td>
            <td>Robert</td>
        </tr>
    </table>
</section>

<section id="issue">
    <h2>Book Issue Form</h2>

    <form>
        <label>Student Name:</label>
        <input type="text" required>

        <label>Student ID:</label>
        <input type="text" required>

        <label>Select Book:</label>
        <select required>
            <option value="">Choose Book</option>
            <option>Web Development</option>
            <option>Programming in C</option>
            <option>Java Basics</option>
        </select>

        <button type="submit">Issue Book</button>
    </form>
</section>

<footer>
    <p>&copy; 2026 College Library</p>
</footer>

</body>
</html>
